# ============================================================
#  KERONGPenguin-Render 配置文件
#  KERONGPenguin 图片渲染功能的 HuHoBot 附属
#
#  QQ 连接 / 扫码 / 群列表 / 绑定 / 白名单等由 HuHoBotPenguin
#  的配置统一管理，本文件只管图片渲染相关部分。
#
#  修改后执行 /hbkrg reload 即时生效（无需重启）。
# ============================================================

# 配置文件版本（勿手动修改，升级时自动补齐新增键）
config-version: 1

# 服务器名称（显示在每张图片卡片的副标题条）
serverName: "我的服务器"

# ---------- 指令接管（与 HuHoBot 内置重名的指令） ----------
# true  = 由本附属回复（图片卡片，默认）
# false = 由 HuHoBot 内置行为回复（查在线=自带渲染/MOTD图，查信息=OpenId文本）
# 关闭后消息自动回落到 HuHoBot 内置指令，附属的专属指令不受影响。
override-commands:
  查在线: true   # 同时控制别名「在线」
  查信息: true

# ---------- 附属自身指令开关 ----------
# 关闭后对应指令回复「此命令已被管理员关闭」。
commands:
  查信息: true
  查在线: true
  在线: true
  查性能: true
  在线排行榜: true
  财富榜: true

# ---------- 渲染设置 ----------
render:
  # 同一用户两次触发图片指令的最小间隔秒数（防刷屏渲染风暴）；0 = 关闭
  command-cooldown-seconds: 5

  # 查信息结果缓存秒数（TTL 内同一玩家直接复用上次图片，0 = 关闭，最大 600）
  result-cache-seconds: 60

  # 头像磁盘缓存时长（小时，可填小数；0 = 不落盘只留内存缓存）
  avatar-cache-hours: 3.0

  # 渲染空闲多少分钟后释放图像缓存内存（0 = 不自动释放）
  idle-release-minutes: 15.0

  # 毛玻璃模糊度 0-100（背景底图毛玻璃效果强度）
  blur-strength: 50

  # 标题卡半透明黑度 0-255（四张卡片顶部标题区）
  title-card-gray: 80

  # 列表容器底色黑度 0-255（统计面板 / 行容器 / 状态卡）
  item-card-gray: 106

  # 副标题小卡黑度 0-255（服务器 / 更新时间 / 渲染耗时）
  subtitle-card-gray: 80

  # 查信息卡片是否使用内置背景（false = 随机使用 img/ 目录图片，无图回退内置）
  info-card-builtin-background: true

  # 查在线卡片是否使用内置背景
  online-list-builtin-background: true

  # 自定义渲染线程（开启后需重启生效）
  custom-render-threads:
    enabled: false
    # 渲染线程数 1-16（0 = 自动：CPU 核数一半，夹在 1-4）
    render-threads: 2
    # 头像批量下载线程数 1-16
    avatar-threads: 8

  # 查性能卡片
  performance:
    # 是否使用内置背景
    builtin-background: true
    # 性能卡片整图缓存秒数（0 = 关闭）
    cache-seconds: 60
    # 在线人数卡展示值来源：real = 服务器真实值 | motd = 服务器列表展示值（本机SLP自查询）
    max-players-source: real

# ---------- 图片包下载 ----------
# 关闭后 /hbkrg bpng 的列表与下载入口拒绝执行（bpng stop 不受影响）
image-download:
  enabled: true

# ---------- 在线排行榜 ----------
leaderboard:
  # 每页显示行数 1-100
  page-size: 20
  # 显示前多少名（榜单玩家总量统计不受影响）
  top: 15
  # 是否使用内置背景（false = 随机使用 img/ 目录图片）
  builtin-background: true

# ---------- 财富榜 ----------
coins-leaderboard:
  # 显示前多少名
  top: 15
  # 是否使用内置背景
  builtin-background: true

# ---------- 经济名称别名 ----------
# 填写后所有输出中的「金币」二字替换为该名称（财富榜标题 / 查信息卡片金币项）
# 留空 = 使用默认「金币」
economy-alias: ""

# ---------- 变量获取（PlaceholderAPI） ----------
# 开启后下列项改由 PAPI 变量提供（未安装 PAPI 或读不到时回退附属自带数据）
variable-fetch:
  enabled: true
  # 总在线时长（排行榜数值与查信息卡片）
  total-playtime: ""
  # 今日在线时长（查信息卡片）
  today-playtime: ""
  # 金币（查信息卡片与财富榜）
  coins: ""
  # 点券（查信息卡片）
  points: ""
  # 称号（查信息卡片）
  title: ""
  # 玩家名（查信息卡片头部与排行榜名单）
  player-name: ""
  # 服务器 TPS（查性能卡片；留空走附属自带采集）
  tps: ""
  # 自定义统计项：段名 = 项目ID，子键「项目名称」与「获取变量」
  # 例：
  # custom-items:
  #   等级:
  #     项目名称: "等级"
  #     获取变量: "%player_level%"
  custom-items: {}

# ---------- 消息模板 ----------
# 每条 QQ 文本回复对应的 Markdown 模板文件（位于 Markdown/ 目录，
# 首次启动自动释放默认模板；改文件名即可换用自定义模板）
messages:
  command-disabled: command-disabled.md
  query-too-frequent: query-too-frequent.md
  server-busy: server-busy.md
  image-send-failed: image-send-failed.md
  qq-unknown: qq-unknown.md
  manager-not-ready: manager-not-ready.md
  manager-not-ready-retry: manager-not-ready-retry.md
  manager-not-ready-bind-retry: manager-not-ready-bind-retry.md
  info-not-bound: info-not-bound.md
  info-target-not-bound: info-target-not-bound.md
  info-render-failed: info-render-failed.md
  online-data-unavailable: online-data-unavailable.md
  online-render-failed: online-render-failed.md
  performance-render-failed: performance-render-failed.md
  leaderboard-no-data: leaderboard-no-data.md
  leaderboard-render-failed: leaderboard-render-failed.md
  coins-leaderboard-no-economy: coins-leaderboard-no-economy.md
  coins-leaderboard-no-data: coins-leaderboard-no-data.md
  coins-leaderboard-render-failed: coins-leaderboard-render-failed.md
